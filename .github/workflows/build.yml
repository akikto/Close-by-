name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0

      - name: Write Android SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Set up Gradle wrapper (if missing)
        run: |
          cd android
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Configure Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> android/local.properties
            echo "Supabase credentials configured for CI build."
          else
            echo "No Supabase secrets found — APK will use demo auth (OTP emails are not sent)."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew test assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Build release AAB (debug signing fallback when secrets absent)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace 2>&1 | tee -a ../gradle-build.log

      - name: Lint
        working-directory: android
        continue-on-error: true
        id: lint
        run: ./gradlew lint --stacktrace 2>&1 | tee -a ../gradle-build.log

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          grep -E "Lint|lint|Error:" ../gradle-build.log | tail -30
          exit 1

      - name: Print build errors on failure
        if: failure()
        run: |
          echo "=== Gradle build errors ==="
          if [ -f gradle-build.log ]; then
            grep -E "^e:|^FAILURE:|^> Task :app:compile|FAILED|Tests run:" gradle-build.log | tail -80 | while IFS= read -r line; do
              echo "::error title=Build Error::$line"
            done
            tail -40 gradle-build.log
          else
            echo "::error title=Build Error::gradle-build.log not found"
          fi
          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: closeby-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
