name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        continue-on-error: true

      - name: Set up Gradle wrapper (if missing)
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew test assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Post compile errors to PR
        if: steps.gradle_build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Gradle compile errors"
            echo '```'
            grep -E "^e:|^FAILURE:" gradle-build.log | head -40 || tail -40 gradle-build.log
            echo '```'
          } > /tmp/build-errors.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/build-errors.md

      - name: Fail build if Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Print build errors on failure
        if: failure()
        run: |
          echo "=== Gradle build errors ==="
          if [ -f gradle-build.log ]; then
            grep -E "^e:|^FAILURE:|^> Task :app:compile" gradle-build.log | tail -80 | while IFS= read -r line; do
              echo "::error title=Build Error::$line"
            done
            tail -40 gradle-build.log
          else
            echo "::error title=Build Error::gradle-build.log not found"
          fi
          exit 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: closeby-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
